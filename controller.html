<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>Slide Remote</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; background: #0a0a0f; color: #e8e8f0;
      font-family: monospace; overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      display: flex; flex-direction: column;
      align-items: center; justify-content: space-between;
      padding: 2.5rem 1.5rem 3.5rem;
    }
    header {
      width: 100%; display: flex;
      justify-content: space-between; align-items: center;
    }
    .logo { font-size: 1rem; font-weight: bold; color: #c8f060; letter-spacing: 2px; }
    #status {
      font-size: 0.7rem; letter-spacing: 1px; text-transform: uppercase;
      display: flex; align-items: center; gap: 6px; color: #555;
    }
    #status.ok { color: #c8f060; }
    #status.err { color: #ff5f5f; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

    .btn-row { display: flex; gap: 1rem; width: 100%; flex: 1; max-height: 340px; margin: 2rem 0; }
    .btn {
      flex: 1; border: 1.5px solid #1e1e2e; border-radius: 20px;
      background: #13131a; color: #e8e8f0; font-size: 3rem;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 0.5rem; cursor: pointer;
      transition: transform 0.1s, border-color 0.1s;
      user-select: none; -webkit-user-select: none;
    }
    .btn:active { transform: scale(0.95); border-color: #c8f060; background: #13180a; }
    .btn span { font-size: 0.65rem; letter-spacing: 2px; text-transform: uppercase; color: #555; }
    .btn.next { border-color: #3a4a1a; background: #0e120a; }
    .btn.next span { color: #8faa3a; }
    .hint { font-size: 0.65rem; color: #333; text-align: center; }
  </style>
</head>
<body>
  <header>
    <div class="logo">REMOTE</div>
    <div id="status"><div class="dot"></div><span id="st">connecting…</span></div>
  </header>

  <div class="btn-row">
    <button class="btn prev" onclick="send('prev')">← <span>Prev</span></button>
    <button class="btn next" onclick="send('next')">→ <span>Next</span></button>
  </div>

  <p class="hint">same WiFi as your Mac</p>

  <script>
    let ws, retry;
    const status = document.getElementById('status');
    const st = document.getElementById('st');

    function connect() {
      ws = new WebSocket(`ws://${location.host}/controller`);
      ws.onopen  = () => { status.className='ok';  st.textContent='connected'; };
      ws.onclose = () => { status.className='err'; st.textContent='retrying…'; retry=setTimeout(connect,2000); };
      ws.onerror = () => { status.className='err'; st.textContent='error'; };
    }

    function send(cmd) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ cmd }));
        if (navigator.vibrate) navigator.vibrate(20);
      }
    }

    connect();
  </script>
</body>
</html>
